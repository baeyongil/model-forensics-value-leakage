[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-forensics-value-leakage"
version = "0.1.0"
description = "Causal sentence-resampling and J-lens analysis of value leakage in Qwen3.5"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yongil Bae" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.9,<4",
]
semantic = [
  "sentence-transformers>=3.3,<6",
]
gpu = [
  "accelerate>=1.2,<3",
  "huggingface-hub>=0.29,<2",
  "safetensors>=0.5,<1",
  "torch>=2.7,<3",
  "transformers>=5.0,<6",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
model-forensics = "model_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires optional model or network dependencies",
  "gpu: requires a CUDA multi-GPU environment",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "reports", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
